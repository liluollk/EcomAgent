[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

# The real connection URL is resolved by migrations/env.py:
# 1. config.attributes["database_url"] (injected by the test fixtures)
# 2. RUNTIME_DATABASE_URL environment variable
# 3. local default database agent_runtime
# Kept empty here; placeholder only.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
