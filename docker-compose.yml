services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime
      POSTGRES_DB: agent_runtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d agent_runtime"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    # 生产入口:不含种子接口,不装脚本模型。密钥必须由 .env 提供;
    # 留空时进程启动即失败(见 apps/settings.py),不会带着默认密钥收请求。
    # 先应用迁移再启动;exec 让 uvicorn 成为 shell 的直接进程,SIGTERM 直达。
    command: >
      sh -c ".venv/bin/alembic upgrade head &&
             exec .venv/bin/uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      RUNTIME_DATABASE_URL: postgresql+asyncpg://runtime:runtime@postgres:5432/agent_runtime
      RUNTIME_JWT_SECRET: ${RUNTIME_JWT_SECRET:-}
      RUNTIME_MASTER_KEY: ${RUNTIME_MASTER_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  postgres_data:
