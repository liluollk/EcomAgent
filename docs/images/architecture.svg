<svg viewBox="0 0 680 1030" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>EcomAgent Agent Runtime 总体架构</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="292" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">EcomAgent · Agent Runtime 总体架构</text>
  <text x="292" y="50" text-anchor="middle" font-size="12" fill="#888780">任务编排 · 工具安全控制 · 业务能力接入 · 行为回归验证</text>

  <!-- 前端控制台 -->
  <rect x="40" y="70" width="504" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="292" y="90" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">前端控制台 · React + TypeScript</text>
  <text x="292" y="112" text-anchor="middle" font-size="12" fill="#378ADD" dominant-baseline="central">WebSocket 事件流 · 权限卡 / 审批中心 · 运营看板</text>

  <line x1="292" y1="126" x2="292" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="144" font-size="11" fill="#888780">REST + WS 双通道</text>

  <!-- Transport -->
  <rect x="40" y="154" width="504" height="48" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="292" y="174" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">Transport · FastAPI</text>
  <text x="292" y="192" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">REST + WebSocket · 权限管线与工具源装配</text>

  <line x1="292" y1="202" x2="292" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="220" font-size="11" fill="#888780">一次 turn</text>

  <!-- Agent Runtime 执行核心 -->
  <rect x="40" y="230" width="504" height="180" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="56" y="252" font-size="13" font-weight="500" fill="#3C3489">Agent Runtime · 执行核心</text>
  <text x="528" y="252" text-anchor="end" font-size="12" fill="#534AB7">统一事件流契约</text>

  <rect x="56" y="262" width="230" height="62" rx="8" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
  <text x="171" y="280" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">Workspace / Session</text>
  <text x="171" y="300" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">上下文隔离 · 权限模式 · 审计</text>
  <text x="171" y="318" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">JSONL 落盘 · 中断恢复</text>

  <rect x="298" y="262" width="230" height="62" rx="8" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
  <text x="413" y="280" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">Skill 注入 · 渐进式披露</text>
  <text x="413" y="300" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">菜单常驻 · load_skill 注入正文</text>
  <text x="413" y="318" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">长期记忆 · 上下文压缩</text>

  <rect x="56" y="332" width="230" height="62" rx="8" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
  <text x="171" y="350" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">AgentBackend 抽象</text>
  <text x="171" y="370" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">OpenAI / Anthropic / Mock</text>
  <text x="171" y="388" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">流式解析 · 消息归一化</text>

  <rect x="298" y="332" width="230" height="62" rx="8" fill="#FFFFFF" stroke="#CECBF6" stroke-width="0.5"/>
  <text x="413" y="350" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">回合循环 · Tool Call</text>
  <text x="413" y="370" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">多轮循环 · 单轮并发执行</text>
  <text x="413" y="388" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">结果按 Tool Call ID 归位</text>

  <line x1="292" y1="410" x2="292" y2="436" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="428" font-size="11" fill="#888780">Tool Call</text>

  <!-- PreToolUse 权限管线 -->
  <rect x="40" y="438" width="504" height="78" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="56" y="458" font-size="13" font-weight="500" fill="#633806">PreToolUse 权限管线 · 模型无法绕过</text>
  <rect x="74" y="468" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="124" y="480" text-anchor="middle" font-size="12" fill="#854F0B" dominant-baseline="central">RBAC 身份门</text>
  <line x1="176" y1="480" x2="184" y2="480" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="186" y="468" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="236" y="480" text-anchor="middle" font-size="12" fill="#854F0B" dominant-baseline="central">业务规则</text>
  <line x1="288" y1="480" x2="296" y2="480" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="298" y="468" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="348" y="480" text-anchor="middle" font-size="12" fill="#854F0B" dominant-baseline="central">模式门</text>
  <line x1="400" y1="480" x2="408" y2="480" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="410" y="468" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="460" y="480" text-anchor="middle" font-size="12" fill="#854F0B" dominant-baseline="central">HITL 审批</text>
  <text x="292" y="510" text-anchor="middle" font-size="12" fill="#854F0B">成本保护双闸 · ASK 挂起整个 turn 等待批准 · 全程审计</text>

  <line x1="292" y1="516" x2="292" y2="542" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="534" font-size="11" fill="#888780">允许执行</text>

  <!-- Execution Policy -->
  <rect x="40" y="544" width="504" height="78" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="56" y="564" font-size="13" font-weight="500" fill="#27500A">Execution Policy · 执行可靠性</text>
  <rect x="74" y="574" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
  <text x="124" y="586" text-anchor="middle" font-size="12" fill="#3B6D11" dominant-baseline="central">错误分类重试</text>
  <line x1="176" y1="586" x2="184" y2="586" stroke="#639922" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="186" y="574" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
  <text x="236" y="586" text-anchor="middle" font-size="12" fill="#3B6D11" dominant-baseline="central">幂等键</text>
  <line x1="288" y1="586" x2="296" y2="586" stroke="#639922" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="298" y="574" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
  <text x="348" y="586" text-anchor="middle" font-size="12" fill="#3B6D11" dominant-baseline="central">读写分级超时</text>
  <line x1="400" y1="586" x2="408" y2="586" stroke="#639922" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="410" y="574" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
  <text x="460" y="586" text-anchor="middle" font-size="12" fill="#3B6D11" dominant-baseline="central">双层结果校验</text>
  <text x="292" y="616" text-anchor="middle" font-size="12" fill="#3B6D11">仅瞬态错误指数退避 · 重试复用同一幂等键 · HTTP 200 ≠ Tool 成功</text>

  <line x1="292" y1="622" x2="292" y2="648" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="640" font-size="11" fill="#888780">工具执行</text>

  <!-- 工具源 -->
  <rect x="40" y="650" width="246" height="84" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="163" y="676" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">内置平台工具</text>
  <text x="163" y="700" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">11 个电商语义操作 + save_skill</text>
  <text x="163" y="722" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">查询 / 调价 / 上下架 / 促销 / 售后</text>

  <rect x="298" y="650" width="246" height="84" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="421" y="670" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">MCP 外部工具</text>
  <text x="421" y="690" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">stdio / JSON-RPC 子进程</text>
  <text x="421" y="708" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">配置化接入 · 通道已验证</text>
  <text x="421" y="726" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">外部 Server：汇率 / 天气（演示）</text>

  <line x1="163" y1="734" x2="163" y2="760" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="173" y="752" font-size="11" fill="#888780">领域操作</text>

  <!-- Commerce Adapter -->
  <rect x="40" y="762" width="504" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="292" y="782" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">Commerce Adapter · 协议翻译</text>
  <text x="292" y="802" text-anchor="middle" font-size="12" fill="#534AB7" dominant-baseline="central">CommerceProvider 领域接口 · 渠道注册表配置化即时生效</text>
  <text x="292" y="818" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">新增渠道不新增工具 · Runtime 不感知平台细节</text>

  <line x1="163" y1="826" x2="163" y2="852" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="173" y="844" font-size="11" fill="#888780">httpx 真实 HTTP</text>
  <line x1="421" y1="826" x2="421" y2="852" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="431" y="844" font-size="11" fill="#888780">未来接入</text>

  <!-- 底层平台 -->
  <rect x="40" y="854" width="246" height="88" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="163" y="878" text-anchor="middle" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">Mock Commerce API</text>
  <text x="163" y="898" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">认证 · 错误码信封 · 限流</text>
  <text x="163" y="914" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">幂等存储 · 写操作审计</text>
  <text x="163" y="930" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">两阶段确定性故障注入</text>

  <rect x="298" y="854" width="246" height="88" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="421" y="878" text-anchor="middle" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">真实电商平台</text>
  <text x="421" y="898" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">淘宝 / 京东 / 抖店 OpenAPI</text>
  <text x="421" y="914" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">新增 Adapter 实现即接入</text>
  <text x="421" y="930" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">Runtime 与评测体系零改动</text>

  <!-- 第一原则 -->
  <rect x="40" y="960" width="504" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="40" y="960" width="4" height="48" fill="#185FA5"/>
  <text x="58" y="982" font-size="13" font-weight="500" fill="#0C447C">第一原则：Runtime 不知道「淘宝」</text>
  <text x="58" y="1000" font-size="12" fill="#378ADD">平台地址 · 字段 · 签名 · 错误码语义全部收进 Adapter</text>

  <!-- AgentEvent 右侧栏 -->
  <rect x="558" y="70" width="114" height="540" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="615" y="94" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">AgentEvent</text>
  <text x="615" y="114" text-anchor="middle" font-size="11" fill="#5F5E5A">八类事件</text>
  <text x="615" y="130" text-anchor="middle" font-size="11" fill="#5F5E5A">单一事实源</text>
  <line x1="568" y1="142" x2="662" y2="142" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="615" y="160" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">text_delta</text>
  <text x="615" y="178" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">tool_start</text>
  <text x="615" y="196" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">tool_result</text>
  <text x="615" y="214" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">permission_req</text>
  <text x="615" y="232" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">typed_error</text>
  <text x="615" y="250" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">status</text>
  <text x="615" y="268" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">complete</text>
  <text x="615" y="286" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', Consolas, monospace">abort</text>
  <line x1="568" y1="300" x2="662" y2="300" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="615" y="320" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">驱动三个消费方</text>
  <rect x="570" y="332" width="90" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="615" y="344" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">前端 UI</text>
  <rect x="570" y="364" width="90" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="615" y="376" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">评测断言</text>
  <rect x="570" y="396" width="90" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="615" y="408" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">轨迹 Trace</text>
  <line x1="568" y1="436" x2="662" y2="436" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="615" y="456" text-anchor="middle" font-size="11" fill="#5F5E5A">可观测字段是增补</text>
  <text x="615" y="474" text-anchor="middle" font-size="11" fill="#5F5E5A">不是第二套日志</text>
  <line x1="568" y1="490" x2="662" y2="490" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="615" y="510" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">同一份事件流</text>
  <text x="615" y="528" text-anchor="middle" font-size="11" fill="#5F5E5A">断言到事件粒度</text>
  <text x="615" y="546" text-anchor="middle" font-size="11" fill="#5F5E5A">行为回归即拦截</text>

  <!-- 贯穿连接虚线 -->
  <line x1="544" y1="98" x2="558" y2="98" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="544" y1="320" x2="558" y2="320" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="544" y1="477" x2="558" y2="477" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="544" y1="583" x2="558" y2="583" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
</svg>
