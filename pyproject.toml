[project]
name = "agent-runtime-workbench"
version = "0.1.0"
description = "Agent runtime workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyjwt",
    "argon2-cffi",
    "cryptography",
    "jsonschema",
    "openai",
    "anthropic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime", "agents", "adapters", "apps", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
