schema_version: 2
# 故障恢复数据集(计划 05 Task 6):数据声明期望,代码执行验证。
#
# 每例声明:id / category / risk_level / fault(故障注名,执行分派键)/
# expectation(期望摘要)/ expected_reconcile_path(UNKNOWN 后的权威回查
# 路径;未发生 UNKNOWN 时空)/ max_logical_writes(逻辑写上界)/
# expected_final_state(权威最终状态:平台价格 + Run 终态)。
#
# 覆盖七类故障点:模型超时、Tool 调用前进程崩溃、写入已生效响应丢失、确认后
# 执行器重启、平台持续不可用、回查暂时不一致、重复提交。其中
# response_lost_after_commit / permanent_failure / temporary_reconcile_unknown
# 与 adapters.commerce.faults.FaultInjector 的命名故障一一对应;其余四类由
# crash-harness 模式(真实 RunExecutor 恢复扫描 + ScriptedBackend 注入)
# 确定性构造。
cases:
  - id: model-timeout
    category: model_failure
    risk_level: high
    fault: model_timeout
    expectation: >-
      模型超时:Provider 失败归一化为 MODEL_TIMEOUT,可重试错误重试预算耗尽后
      Run 确定性 FAILED,不持久化任何 ToolCall,零副作用,权威价格不变。
    expected_reconcile_path: []
    max_logical_writes: 0
    expected_final_state:
      price: "128.00"
      run_status: FAILED

  - id: executor-exit-before-write
    category: executor_lifecycle
    risk_level: medium
    fault: executor_exit_before_write
    expectation: >-
      外部写前执行器崩溃:Run 与 Attempt 停在 RUNNING,尚无 ToolCall / Operation。
      进程重启后恢复扫描把遗留 Attempt 标记 ABANDONED(EXECUTOR_RESTART),Run
      退回 QUEUED 并重新推进到下一个用户边界(仍需补充的输入不被跳过),崩溃
      前后均零外部写入、权威价格不变。
    expected_reconcile_path: []
    max_logical_writes: 0
    expected_final_state:
      price: "128.00"
      run_status: WAITING_INPUT

  - id: write-applied-response-lost
    category: response_loss
    risk_level: high
    fault: response_lost_after_commit
    expectation: >-
      写入已生效但响应丢失:Operation 落 UNKNOWN、Run 进入 WAITING_RECONCILIATION,
      由执行器在同一推进内回查 APPLIED 并续推到 COMPLETED,权威写入恰好一次,
      价格落到目标值。
    expected_reconcile_path: ["UNKNOWN", "APPLIED"]
    max_logical_writes: 1
    expected_final_state:
      price: "99.00"
      run_status: COMPLETED

  - id: executor-restart-after-confirmation
    category: executor_lifecycle
    risk_level: high
    fault: executor_restart_after_confirmation
    expectation: >-
      确认接受后执行器崩溃:接受已提交、Run 停在 RUNNING;进程重启后恢复扫描
      接管并继续推进,已接受的确认语义保持,写入恰好一次,Run COMPLETED。
    expected_reconcile_path: []
    max_logical_writes: 1
    expected_final_state:
      price: "99.00"
      run_status: COMPLETED

  - id: platform-persistent-failure
    category: platform_failure
    risk_level: high
    fault: permanent_failure
    expectation: >-
      平台持续不可用:回执确定 FAILED(不 UNKNOWN)且不声明可重试,Operation
      NOT_APPLIED、ToolCall 落 FAILED 终态,失败随 Tool Result 返回模型——Run 不
      重排队、不再自动重试同一个 ToolCall。权威状态不变、零逻辑写,不产生 UNKNOWN
      回查。(持续故障与"暂时不可用"是两种语义:后者需要独立的原因码与重试预算。)
    expected_reconcile_path: []
    max_logical_writes: 0
    expected_final_state:
      price: "128.00"
      run_status: COMPLETED

  - id: reconcile-temporarily-inconsistent
    category: recovery_reconciliation
    risk_level: high
    fault: temporary_reconcile_unknown
    expectation: >-
      回查暂时不一致:第一次回查 UNKNOWN(预算内保持 WAITING_RECONCILIATION
      并再次调度),第二次回查 APPLIED 后恢复推进到 COMPLETED,权威写入
      恰好一次。
    expected_reconcile_path: ["UNKNOWN", "UNKNOWN", "APPLIED"]
    max_logical_writes: 1
    expected_final_state:
      price: "99.00"
      run_status: COMPLETED

  - id: duplicate-submit
    category: idempotency
    risk_level: medium
    fault: duplicate_submit
    expectation: >-
      重复提交:同 operation_id 经真实执行端点再次提交,平台按幂等键回放
      上次回执,不产生第二次逻辑写,权威价格保持首次写入值。
    expected_reconcile_path: []
    max_logical_writes: 1
    expected_final_state:
      price: "99.00"
      run_status: COMPLETED
