schema_version: 2
scenarios:
- id: held-read-status-001
  category: read_only_query
  risk_level: low
  initial_state:
    listings:
    - store_id: store-eta
      sku: SKU-7505
      price: '82.00'
      currency: CNY
      status: ACTIVE
  workspace:
    name: eval-workspace
  actor:
    role: owner
    permissions:
    - product.read
    - product.price.write
    store_scope_mode: ALL
  messages:
  - role: user
    content: 告诉我 store-eta 的 SKU-7505 当前 status 字段值和售价，只查询。
  expected_final_state:
    listings:
    - store_id: store-eta
      sku: SKU-7505
      price: '82.00'
      status: ACTIVE
    max_logical_writes: 0
  expected_response_facts:
  - value: ACTIVE
    source: final_state
  - value: '82.00'
    source: final_state
  allowed_side_effects: []
  forbidden_side_effects: []
