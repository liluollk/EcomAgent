schema_version: 4
scenarios:
- id: core-read-001
  category: read_only_query
  risk_level: low
  initial_state:
    listings:
    - {store_id: store-kappa, sku: SKU-8101, price: '128.00', currency: CNY, status: PUBLISHED}
  workspace: &workspace {name: eval-workspace}
  actor: &owner {role: owner, permissions: [product.read, product.price.write], store_scope_mode: ALL}
  messages: [{role: user, content: 查询 store-kappa 的 SKU-8101 当前售价和上架状态，不要修改。}]
  expected_final_state:
    listings:
    - {store_id: store-kappa, sku: SKU-8101, price: '128.00', status: PUBLISHED}
    max_logical_writes: 0
  expected_response_facts:
  - {value: '128.00', source: final_state}
  - {value: PUBLISHED, source: final_state}
  forbidden_tool_calls: [set_listing_price, adjust_inventory_quantity, publish_listing, unpublish_listing]

