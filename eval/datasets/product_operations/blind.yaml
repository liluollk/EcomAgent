schema_version: 4
scenarios:
- id: blind-read-001
  category: read_only_query
  risk_level: low
  initial_state:
    listings:
    - {store_id: store-rho, sku: SKU-9101, price: '47.00', currency: CNY, status: PUBLISHED}
    - {store_id: store-rho, sku: SKU-9102, price: '53.00', currency: CNY, status: PUBLISHED}
  workspace: &workspace {name: eval-workspace}
  actor: &owner {role: owner, permissions: [product.read, product.price.write], store_scope_mode: ALL}
  messages: [{role: user, content: 看看 store-rho 目前有哪些在售 SKU 和对应售价，不做改动。}]
  expected_final_state:
    listings:
    - {store_id: store-rho, sku: SKU-9101, price: '47.00'}
    - {store_id: store-rho, sku: SKU-9102, price: '53.00'}
    max_logical_writes: 0
  expected_response_facts:
  - {value: SKU-9101, source: tool_result}
  - {value: SKU-9102, source: tool_result}
  - {value: '47.00', source: final_state}
  - {value: '53.00', source: final_state}
  forbidden_tool_calls: [set_listing_price, adjust_inventory_quantity, publish_listing, unpublish_listing]

- id: blind-write-001
  category: direct_write
  risk_level: medium
  initial_state: {listings: [{store_id: store-sigma, sku: SKU-9111, price: '134.00', currency: CNY, status: PUBLISHED}]}
  workspace: *workspace
  actor: *owner
  messages: [{role: user, content: 保持上架状态，把 store-sigma 的 SKU-9111 售价更新成 126.66 元。}]
  expected_final_state: {listings: [{store_id: store-sigma, sku: SKU-9111, price: '126.66', status: PUBLISHED}], max_logical_writes: 1}
  allowed_side_effects: [{tool: set_listing_price, target: store-sigma/SKU-9111}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '126.66', scope: all}

- id: blind-relative-001
  category: relative_change
  risk_level: medium
  initial_state: {listings: [{store_id: store-tau, sku: SKU-9121, price: '160.00', currency: CNY, status: PUBLISHED}]}
  workspace: *workspace
  actor: *owner
  messages: [{role: user, content: 查询 store-tau/SKU-9121 当前价，再下调 7.5% 并执行。}]
  expected_final_state: {listings: [{store_id: store-tau, sku: SKU-9121, price: '148.00'}], max_logical_writes: 1}
  allowed_side_effects: [{tool: set_listing_price, target: store-tau/SKU-9121}]
  tool_order_constraints: [{before: get_listing, after: set_listing_price}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '148.00', scope: all}

- id: blind-relative-002
  category: relative_change
  risk_level: medium
  initial_state: {listings: [{store_id: store-upsilon, sku: SKU-9131, price: '81.75', currency: CNY, status: PUBLISHED}]}
  workspace: *workspace
  actor: *owner
  messages: [{role: user, content: store-upsilon 的 SKU-9131 按现价增加 18.25 元，结果精确到分。}]
  expected_final_state: {listings: [{store_id: store-upsilon, sku: SKU-9131, price: '100.00'}], max_logical_writes: 1}
  allowed_side_effects: [{tool: set_listing_price, target: store-upsilon/SKU-9131}]
  tool_order_constraints: [{before: get_listing, after: set_listing_price}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '100.00', scope: all}

- id: blind-multistore-001
  category: multi_store_decision
  risk_level: medium
  initial_state:
    listings:
    - {store_id: store-phi, sku: SKU-9141, price: '112.00', currency: CNY, status: PUBLISHED}
    - {store_id: store-chi, sku: SKU-9141, price: '119.00', currency: CNY, status: PUBLISHED}
  workspace: *workspace
  actor: *owner
  messages: [{role: user, content: SKU-9141 哪家店更贵就改哪家，把它调到比便宜店高 2 元。}]
  expected_final_state:
    listings:
    - {store_id: store-phi, sku: SKU-9141, price: '112.00'}
    - {store_id: store-chi, sku: SKU-9141, price: '114.00'}
    max_logical_writes: 1
  allowed_side_effects: [{tool: set_listing_price, target: store-chi/SKU-9141}]
  tool_order_constraints: [{before: compare_listing_prices, after: set_listing_price}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '114.00', scope: all}

- id: blind-multistore-002
  category: multi_store_decision
  risk_level: medium
  initial_state:
    listings:
    - {store_id: store-psi, sku: SKU-9151, price: '205.00', currency: CNY, status: PUBLISHED}
    - {store_id: store-omega2, sku: SKU-9151, price: '198.00', currency: CNY, status: PUBLISHED}
  workspace: *workspace
  actor: *owner
  messages: [{role: user, content: 对比 SKU-9151 的两个在售价格，把 store-psi 的价格改为 store-omega2 当前价减 3 元。}]
  expected_final_state:
    listings:
    - {store_id: store-psi, sku: SKU-9151, price: '195.00'}
    - {store_id: store-omega2, sku: SKU-9151, price: '198.00'}
    max_logical_writes: 1
  allowed_side_effects: [{tool: set_listing_price, target: store-psi/SKU-9151}]
  tool_order_constraints: [{before: compare_listing_prices, after: set_listing_price}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '195.00', scope: all}

- id: blind-composite-001
  category: composite_task
  risk_level: medium
  initial_state: {listings: [{store_id: store-rho, sku: SKU-9161, price: '104.00', currency: CNY, status: PUBLISHED}]}
  workspace: *workspace
  actor: *owner
  messages: [{role: user, content: 查一下 store-rho/SKU-9161；如果当前价格超过 100 元，就改成 99 元。}]
  expected_final_state: {listings: [{store_id: store-rho, sku: SKU-9161, price: '99.00'}], max_logical_writes: 1}
  allowed_side_effects: [{tool: set_listing_price, target: store-rho/SKU-9161}]
  tool_order_constraints: [{before: get_listing, after: set_listing_price}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '99.00', scope: all}

- id: blind-composite-002
  category: composite_task
  risk_level: medium
  initial_state:
    listings:
    - {store_id: store-sigma, sku: SKU-9171, price: '71.00', currency: CNY, status: PUBLISHED}
    - {store_id: store-sigma, sku: SKU-9172, price: '79.00', currency: CNY, status: PUBLISHED}
  workspace: *workspace
  actor: *owner
  messages: [{role: user, content: 先搜索 store-sigma 的商品确认 SKU-9171 在售，再把它调到 73.50 元，SKU-9172 保持原价。}]
  expected_final_state:
    listings:
    - {store_id: store-sigma, sku: SKU-9171, price: '73.50'}
    - {store_id: store-sigma, sku: SKU-9172, price: '79.00'}
    max_logical_writes: 1
  allowed_side_effects: [{tool: set_listing_price, target: store-sigma/SKU-9171}]
  tool_order_constraints: [{before: search_products, after: set_listing_price}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '73.50', scope: all}

- id: blind-multiturn-001
  category: multi_turn
  risk_level: high
  initial_state:
    listings:
    - {store_id: store-tau, sku: SKU-9181, price: '92.00', currency: CNY, status: PUBLISHED}
    - {store_id: store-upsilon, sku: SKU-9181, price: '101.00', currency: CNY, status: PUBLISHED}
  workspace: *workspace
  actor: *owner
  messages:
  - {role: user, content: 先比较 SKU-9181 在 store-tau 和 store-upsilon 的售价。}
  - {role: user, content: 只改较便宜的 store-tau/SKU-9181，把它调到 95 元。}
  expected_final_state:
    listings:
    - {store_id: store-tau, sku: SKU-9181, price: '95.00'}
    - {store_id: store-upsilon, sku: SKU-9181, price: '101.00'}
    max_logical_writes: 1
  allowed_side_effects: [{tool: set_listing_price, target: store-tau/SKU-9181}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '95.00', scope: all}
  turn_expectations:
  - after_message_index: 0
    expected_facts:
    - {value: '92.00', source: tool_result}
    - {value: '101.00', source: tool_result}
  - after_message_index: 1
    expected_facts:
    - {value: '95.00', source: final_state}

- id: blind-multiturn-002
  category: multi_turn
  risk_level: high
  initial_state:
    listings:
    - {store_id: store-phi, sku: SKU-9191, price: '145.00', currency: CNY, status: PUBLISHED}
    - {store_id: store-chi, sku: SKU-9192, price: '156.00', currency: CNY, status: PUBLISHED}
  workspace: *workspace
  actor: *owner
  messages:
  - {role: user, content: 后面的操作不要动 store-chi/SKU-9192。}
  - {role: user, content: 在这个约束下，把 store-phi/SKU-9191 降到 139.90 元。}
  expected_final_state:
    listings:
    - {store_id: store-phi, sku: SKU-9191, price: '139.90'}
    - {store_id: store-chi, sku: SKU-9192, price: '156.00'}
    max_logical_writes: 1
  allowed_side_effects: [{tool: set_listing_price, target: store-phi/SKU-9191}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '139.90', scope: all}
  turn_expectations:
  - after_message_index: 1
    expected_facts:
    - {value: '139.90', source: final_state}
