  - {role: assistant, content: 这个 SKU 在多个店铺在售，需要店铺范围。}
  - {role: user, content: 把 store-delta 的 SKU-4004 改到 72 元。}
  interactions: [{kind: input, message_index: 2, values: {store_ref: store-delta}}]
  clarification: {missing_fields: [store_ref]}
  expected_final_state:
    listings:
    - {store_id: store-gamma, sku: SKU-4004, price: '68.00'}
    - {store_id: store-delta, sku: SKU-4004, price: '72.00'}
    max_logical_writes: 1
  allowed_side_effects: [{tool: set_listing_price, target: store-delta/SKU-4004}]
  expected_tool_arguments:
  - {tool: set_listing_price, field: target_price, value: '72.00', scope: all}

