name: backend

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime -d agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUNTIME_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/agent_runtime
      RUNTIME_TEST_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/agent_runtime_test
      # 测试库清理需显式授权;CI 的 service 容器只在本作业内存在,可安全清空。
      RUNTIME_TEST_RESET_ALLOWED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Verify packaged runtime entry points
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv run python scripts/check_wheel_imports.py "$RUNNER_TEMP"/wheel/*.whl
      - run: uv run alembic upgrade head
      - run: uv run ruff check runtime agents adapters apps eval tests
      - run: uv run mypy runtime agents adapters apps eval
      - run: uv run pytest -q
