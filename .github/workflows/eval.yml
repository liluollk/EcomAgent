name: eval

on:
  # 推 main 就跑确定性门(运行时不变式 + 故障恢复 + 分区校验)。
  # 真实模型分区仍只在 workflow_dispatch 下跑,不会因为推送消耗额度。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      split:
        description: release 跑完整发布验证(Core + Safety + Regression + 门禁);其余只跑单分区
        required: true
        default: release
        type: choice
        options:
          - release
          - core
          - blind
          - clarification
          - regression
          - safety

jobs:
  # runtime_suite / recovery_suite 都要连测试库(``_prepare_database`` 会先建库再
  # 跑迁移),本 job 少一个 postgres 服务就会在第一步 ConnectionRefused 失败。
  deterministic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime -d agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUNTIME_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/agent_runtime
      RUNTIME_TEST_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/agent_runtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m eval.runtime_suite --dataset eval/datasets/runtime
      - run: uv run python -m eval.recovery_suite --dataset eval/datasets/recovery/faults.yaml
      # 数据集分区互斥与 Held-out 哈希校验。
      - run: uv run pytest tests/eval/test_dataset_partitions.py -q

  # 真实模型 Eval(DeepSeek):仅手动触发,不在 Pull Request 中自动消耗额度。
  # 需要仓库 Secrets:EVAL_BASE_URL、EVAL_MODEL、EVAL_API_KEY。
  # 运行前需在 GitHub 仓库 Settings → Secrets and variables → Actions 配置。
  #
  # 能力清单必须由正式 Provisioner 对着已迁移的库生成:本 job 起 postgres、
  # 跑迁移、再生成清单,三个前置步骤缺一步都会在参数/环境校验阶段失败。
  product-real-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: agent_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime -d agent_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUNTIME_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/agent_runtime_test
      RUNTIME_TEST_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/agent_runtime_test
      EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
      EVAL_MODEL: ${{ secrets.EVAL_MODEL }}
      EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Verify eval provider secrets are configured
        run: |
          for name in EVAL_BASE_URL EVAL_MODEL EVAL_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
      - name: Prepare test database
        run: uv run alembic upgrade head
      - name: Build freeze-time capability manifest
        run: |
          uv run python -m eval.capability_manifest --output "$RUNNER_TEMP/capability-manifest.json"
      # 报告里的 Runtime/E2E 通过声明由本 job 自己的执行结果决定,用于发布 Gate。
      - name: Deterministic Runtime and E2E attestations
        run: |
          uv run python -m eval.runtime_suite --dataset eval/datasets/runtime
          uv run python -m eval.recovery_suite --dataset eval/datasets/recovery/faults.yaml
          uv run pytest tests/apps/api/test_e2e_product_flow.py -q
      - name: Run core split
        if: inputs.split == 'release' || inputs.split == 'core'
        run: |
          uv run python -m eval.product_suite \
            --split core \
            --capability-manifest "$RUNNER_TEMP/capability-manifest.json" \
            --runtime-suite-result passed \
            --e2e-result passed \
            --output reports/core.json
      # 发布结论必须带安全证据:Core 分区没有安全适用用例,只凭它无法证明
      # 危险操作被拦住。release 模式固定一起跑 Safety 与 Regression。
      - name: Run safety split
        if: inputs.split == 'release' || inputs.split == 'safety'
        run: |
          uv run python -m eval.product_suite \
            --split safety \
            --capability-manifest "$RUNNER_TEMP/capability-manifest.json" \
            --runtime-suite-result passed \
            --e2e-result passed \
            --output reports/safety.json
      - name: Run regression split
        if: inputs.split == 'release' || inputs.split == 'regression'
        run: |
          uv run python -m eval.product_suite \
            --split regression \
            --capability-manifest "$RUNNER_TEMP/capability-manifest.json" \
            --runtime-suite-result passed \
            --e2e-result passed \
            --output reports/regression.json
      - name: Run requested split
        if: inputs.split != 'release' && inputs.split != 'core' && inputs.split != 'safety' && inputs.split != 'regression'
        run: |
          uv run python -m eval.product_suite \
            --split "${{ inputs.split }}" \
            --capability-manifest "$RUNNER_TEMP/capability-manifest.json" \
            --runtime-suite-result passed \
            --e2e-result passed \
            --output "reports/${{ inputs.split }}.json"
      # 冻结门存在且是 release 模式时才做放行检查:门禁需要 Core 与 Safety
      # 两份报告,只跑单分区时不虚构放行结论。
      - name: Release gate (core + safety)
        if: inputs.split == 'release' && hashFiles('eval/gates/v*.json') != ''
        run: |
          gate=$(ls eval/gates/v*.json | sort -V | tail -1)
          uv run python -m eval.gates.check_release \
            --gate "$gate" \
            --report reports/core.json \
            --safety-report reports/safety.json
      - uses: actions/upload-artifact@v4
        with:
          name: product-eval-${{ inputs.split }}-${{ github.run_id }}
          path: reports/*.json
